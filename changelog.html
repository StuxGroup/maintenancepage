<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <title>Changelog &mdash; Stux.Group</title>
    <meta charset="UTF-8">
    <meta name="description" content="Everything that's changed on this maintenance page, release by release.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stux.group/icon.png">
    <link rel="stylesheet" href="assets/fonts/fonts.css">
    <style>
        :root {
            --red:      #D11010;
            --red-mid:  #d95656;
            --red-soft: #bf3a3a;
        }
        [data-theme="dark"] {
            --bg:     #1e0303;
            --text:   #ffffff;
            --muted:  #d9b6b6;
            --card:   rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.12);
        }
        [data-theme="light"] {
            --red-mid:  #a01818;
            --red-soft: #7a0f0f;
            --bg:     #ffe8e6;
            --text:   #111111;
            --muted:  #6b4a4a;
            --card:   rgba(0,0,0,0.03);
            --border: rgba(0,0,0,0.12);
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Barlow', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        a { color: var(--red); text-decoration: none; font-weight: 700; }
        a:hover { text-decoration: underline; }

        .topbar { display: flex; align-items: center; padding: 18px 6%; }
        .topbar a { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .topbar img { height: 32px; width: auto; }

        #theme-toggle {
            position: fixed;
            top: 14px; right: 14px;
            z-index: 100;
            background: rgba(209, 16, 16, 0.12);
            border: 1px solid rgba(209, 16, 16, 0.35);
            border-radius: 50%;
            width: 38px; height: 38px;
            font-size: 17px;
            line-height: 38px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            color: var(--text);
            transition: background 0.2s;
        }
        #theme-toggle:hover { background: rgba(209, 16, 16, 0.22); }

        main { max-width: 760px; margin: 0 auto; padding: 10px 6% 60px; }
        h1 { font-size: clamp(28px, 5vw, 40px); margin: 12px 0 8px; }
        .subtitle { color: var(--muted); margin: 0 0 32px; font-size: 16px; line-height: 1.6; }

        .changelog-entry {
            padding: 16px 18px;
            margin: 0 0 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
        }
        .changelog-entry-head { margin: 0 0 10px; }
        .changelog-version { margin: 0; font-size: 18px; color: var(--red); }

        .changelog-label-row { margin: 14px 0 8px; }
        .changelog-label-row:first-of-type { margin-top: 0; }
        .changelog-label {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 5px;
            color: var(--cl); background: color-mix(in srgb, var(--cl) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--cl) 45%, transparent);
        }
        /* Fixed type palette & order: Added, Changed, Fixed, Removed, Security, Deprecated */
        .changelog-label-added      { --cl: #2ecc71; }
        .changelog-label-changed    { --cl: #3ba7ff; }
        .changelog-label-fixed      { --cl: #ffa64d; }
        .changelog-label-removed    { --cl: #ff4d4d; }
        .changelog-label-security   { --cl: #b06bff; }
        .changelog-label-deprecated { --cl: #8a8a94; }
        [data-theme="light"] .changelog-label-added      { --cl: #1e8449; }
        [data-theme="light"] .changelog-label-changed    { --cl: #1a6fc0; }
        [data-theme="light"] .changelog-label-fixed      { --cl: #b8650f; }
        [data-theme="light"] .changelog-label-removed    { --cl: #c62828; }
        [data-theme="light"] .changelog-label-security   { --cl: #7b3fc4; }
        [data-theme="light"] .changelog-label-deprecated { --cl: #5f5f68; }

        .changelog-list {
            margin: 0 0 4px;
            padding-left: 20px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }
        .changelog-list li { margin: 0 0 4px; }
        .changelog-list code {
            background: rgba(209, 16, 16, 0.12);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .changelog-p { color: var(--muted); font-size: 13px; }

        footer.site-footer {
            text-align: center;
            padding: 20px 6% 30px;
            font-size: 12px;
            color: var(--muted);
        }
        footer.site-footer a { color: var(--muted); font-weight: 400; text-decoration: underline; }
    </style>
    <link rel="stylesheet" href="/assets/site-banner.css">
    <link rel="stylesheet" href="/assets/site-brand.css">
</head>
<body>

    <div class="topbar">
        <a href="./">
            <img src="https://global.media.stux.group/icon.png" alt="Stux.Group">
            <span>Stux.Group</span>
        </a>
    </div>

    <button type="button" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9728;</button>

    <main>
        <h1>Changelog</h1>
        <p class="subtitle">Everything that's changed on this maintenance page, release by release.</p>

        <div id="changelog-body">
            <p class="changelog-p">Loading changelog&hellip;</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="brand-strip"><a href="https://stux.group" target="_blank" rel="noopener" aria-label="Stux.Group"><img class="brand-strip-mark" src="https://global.media.stux.group/icon.png" alt="Stux.Group" title="Stux.Group" height="28"></a><span class="brand-strip-sep" aria-hidden="true">|</span><a class="brand-strip-text" href="https://services.stux.group" target="_blank" rel="noopener">A Stux.Group Service</a></div>
        <p class="created-with">Created with <svg class="cw-love" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><title>Love</title><path d="M8 14.3S1.4 10.2 1.4 5.7A3.4 3.4 0 0 1 8 4a3.4 3.4 0 0 1 6.6 1.7c0 4.5-6.6 8.6-6.6 8.6z"/></svg> / <svg class="cw-code" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><title>Code</title><path d="M5 3.7 6.2 4.9 3.1 8l3.1 3.1L5 12.3.7 8zM11 3.7 15.3 8 11 12.3l-1.2-1.2L12.9 8 9.8 4.9zM9.2 2.2l1.2.4-3.6 11.2-1.2-.4z"/></svg> / <svg class="cw-coffee" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><title>Coffee</title><path d="M1.5 5.5h9.5v4a3.5 3.5 0 0 1-3.5 3.5h-2.5A3.5 3.5 0 0 1 1.5 9.5zM12 6.3h.7a2.4 2.4 0 0 1 0 4.8h-1.3c.3-.4.5-.9.6-1.4h.7a1 1 0 0 0 0-2H12zM3.8 1.4H5v2.8H3.8zM6.6 1.4h1.2v2.8H6.6z"/></svg><span class="cw-sr"> love, code and coffee</span> by <a href="https://stux.group" target="_blank" rel="noopener">Stux.Group</a></p>
        <p><svg class="cw-copy" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><title>Copyright</title><path fill-rule="evenodd" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 1.4a5.6 5.6 0 1 0 0 11.2A5.6 5.6 0 0 0 8 2.4zM10.3 6.2A2.7 2.7 0 1 0 10.3 9.8l1.1.8A4 4 0 1 1 11.4 5.4z"/></svg><span class="cw-sr"><svg class="cw-copy" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><title>Copyright</title><path fill-rule="evenodd" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 1.4a5.6 5.6 0 1 0 0 11.2A5.6 5.6 0 0 0 8 2.4zM10.3 6.2A2.7 2.7 0 1 0 10.3 9.8l1.1.8A4 4 0 1 1 11.4 5.4z"/></svg><span class="cw-sr">&copy;</span></span> <span data-copyright-years data-start="2023">2023–2026</span> Stux.Group &mdash; part of the Stux.Group Brand of Companies.</p>
        <p><a href="./">&larr; Back to Stux.Group</a></p>
    </footer>

    <script>
        var btn = document.getElementById('theme-toggle');
        var html = document.documentElement;
        var saved = localStorage.getItem('sg-theme') || 'dark';
        html.setAttribute('data-theme', saved);
        btn.textContent = saved === 'dark' ? '☀' : '☾';
        btn.addEventListener('click', function() {
            var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            btn.textContent = next === 'dark' ? '☀' : '☾';
            localStorage.setItem('sg-theme', next);
        });
    </script>
    <script>
        (function () {
            var target = document.getElementById('changelog-body');
            var CATEGORIES = ['Added', 'Changed', 'Fixed', 'Removed', 'Security', 'Deprecated'];

            function esc(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            function inline(s) {
                s = esc(s);
                s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                return s;
            }
            // Sort ### sections within each release into CATEGORIES order (unknown types last).
            function sectionRank(heading) {
                var w = ((heading.match(/^###\s+([A-Za-z]+)/) || [])[1] || '').toLowerCase();
                for (var i = 0; i < CATEGORIES.length; i++) {
                    if (CATEGORIES[i].toLowerCase() === w) return i;
                }
                return CATEGORIES.length;
            }
            function sortSections(md) {
                var out = [], pre = [], secs = [];
                function flush() {
                    secs.sort(function (a, b) { return (a.rank - b.rank) || (a.idx - b.idx); });
                    out = out.concat(pre);
                    secs.forEach(function (s) { out = out.concat(s.lines); });
                    pre = []; secs = [];
                }
                md.split('\n').forEach(function (line) {
                    if (/^#{1,2}\s/.test(line)) { flush(); pre.push(line); return; }
                    if (/^###\s/.test(line)) { secs.push({ rank: sectionRank(line), idx: secs.length, lines: [line] }); return; }
                    if (secs.length) secs[secs.length - 1].lines.push(line); else pre.push(line);
                });
                flush();
                return out.join('\n');
            }
            function renderChangelog(md) {
                var lines = sortSections(md.replace(/\r\n/g, '\n').trim()).split('\n');
                var html = '';
                var inEntry = false;
                var inList = false;
                var itemBuf = null;
                var catPattern = new RegExp('^(' + CATEGORIES.join('|') + ')\\b\\s*(.*)$');

                function flushItem() { if (itemBuf !== null) { html += '<li>' + inline(itemBuf) + '</li>\n'; itemBuf = null; } }
                function flushList() { flushItem(); if (inList) { html += '</ul>\n'; inList = false; } }
                function flushEntry() { flushList(); if (inEntry) { html += '</div>\n'; inEntry = false; } }

                lines.forEach(function (raw) {
                    var line = raw.replace(/\s+$/, '');
                    if (line.trim() === '') { flushItem(); return; }

                    var m = line.match(/^##\s+(.+)$/);
                    if (m) {
                        flushEntry();
                        html += '<div class="changelog-entry"><div class="changelog-entry-head"><h3 class="changelog-version">' + esc(m[1].trim()) + '</h3></div>\n';
                        inEntry = true;
                        return;
                    }

                    m = line.match(/^###\s+(.+)$/);
                    if (m) {
                        flushList();
                        var text = m[1].trim();
                        var cm = text.match(catPattern);
                        if (cm) {
                            html += '<div class="changelog-label-row"><span class="changelog-label changelog-label-' + cm[1].toLowerCase() + '">' + cm[1] + '</span></div>\n';
                        } else {
                            html += '<h4 class="changelog-section">' + esc(text) + '</h4>\n';
                        }
                        return;
                    }

                    m = line.match(/^-\s+(.+)$/);
                    if (m) {
                        flushItem();
                        if (!inList) { html += '<ul class="changelog-list">\n'; inList = true; }
                        itemBuf = m[1].trim();
                        return;
                    }

                    if (/^#\s+/.test(line)) { flushItem(); return; }

                    if (inList && itemBuf !== null) {
                        itemBuf += ' ' + line.trim();
                    }
                });

                flushEntry();
                target.innerHTML = html || '<p class="changelog-p">No changelog entries yet.</p>';
            }

            fetch('CHANGELOG.md')
                .then(function (r) {
                    if (!r.ok) throw new Error('fetch failed');
                    return r.text();
                })
                .then(renderChangelog)
                .catch(function () {
                    target.innerHTML = '<p class="changelog-p">Couldn’t load the changelog right now &mdash; see <a href="https://github.com/StuxGroup/maintenancepage/blob/main/CHANGELOG.md">CHANGELOG.md</a> on GitHub instead.</p>';
                });
        })();
    </script>
    <script src="/assets/dev-mode.js"></script>
    <script src="/assets/site-banners.js"></script>
    <script src="/assets/site-banner.js"></script>
<script>(function(){var y=new Date().getFullYear();document.querySelectorAll('[data-copyright-years]').forEach(function(e){var s=parseInt(e.getAttribute('data-start'),10);e.textContent=s>=y?String(y):s+'–'+y;});})();</script>
</body>
</html>
